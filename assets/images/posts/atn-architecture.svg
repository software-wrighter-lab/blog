<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Segoe UI', system-ui, sans-serif" font-size="13">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5"
            markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#8b95a5"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="520" height="420" rx="12" fill="#fafbfc"/>

  <!-- Browser Dashboard -->
  <rect x="60" y="24" width="400" height="80" rx="14" fill="#e8e0f0" filter="url(#shadow)"/>
  <text x="260" y="50" text-anchor="middle" font-weight="600" font-size="14" fill="#4a3d6b">Browser Dashboard</text>
  <line x1="170" y1="60" x2="170" y2="96" stroke="#c4b8d9" stroke-width="1"/>
  <line x1="310" y1="60" x2="310" y2="96" stroke="#c4b8d9" stroke-width="1"/>
  <text x="115" y="80" text-anchor="middle" fill="#5c5080" font-size="12">xterm.js</text>
  <text x="240" y="80" text-anchor="middle" fill="#5c5080" font-size="12">Wiki</text>
  <text x="360" y="80" text-anchor="middle" fill="#5c5080" font-size="12">State</text>

  <!-- Connection lines: Dashboard → Server -->
  <line x1="150" y1="104" x2="150" y2="168" stroke="#8b95a5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="260" y1="104" x2="260" y2="168" stroke="#8b95a5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="370" y1="104" x2="370" y2="168" stroke="#8b95a5" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Protocol labels -->
  <rect x="122" y="126" width="40" height="18" rx="4" fill="#f0f4f8"/>
  <text x="142" y="139" text-anchor="middle" font-size="10" fill="#6b7b8d">SSE</text>
  <rect x="232" y="126" width="44" height="18" rx="4" fill="#f0f4f8"/>
  <text x="254" y="139" text-anchor="middle" font-size="10" fill="#6b7b8d">REST</text>
  <rect x="342" y="126" width="44" height="18" rx="4" fill="#f0f4f8"/>
  <text x="364" y="139" text-anchor="middle" font-size="10" fill="#6b7b8d">REST</text>

  <!-- Axum Server -->
  <rect x="60" y="170" width="400" height="76" rx="14" fill="#d4e8f0" filter="url(#shadow)"/>
  <text x="260" y="196" text-anchor="middle" font-weight="600" font-size="14" fill="#2a5f7a">Axum Server</text>
  <line x1="260" y1="206" x2="260" y2="238" stroke="#a8cdd9" stroke-width="1"/>
  <text x="165" y="226" text-anchor="middle" fill="#3a6f8a" font-size="12">PTY Manager</text>
  <text x="355" y="226" text-anchor="middle" fill="#3a6f8a" font-size="12">Wiki Store</text>

  <!-- Connection lines: Server → bottom layer -->
  <line x1="165" y1="246" x2="165" y2="310" stroke="#8b95a5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="355" y1="246" x2="355" y2="310" stroke="#8b95a5" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Agents box -->
  <rect x="100" y="312" width="130" height="86" rx="14" fill="#fce4cc" filter="url(#shadow)"/>
  <text x="165" y="340" text-anchor="middle" font-weight="600" font-size="12" fill="#8a5c2a">Agent A</text>
  <text x="165" y="358" text-anchor="middle" font-size="12" fill="#8a5c2a">Agent B</text>
  <text x="165" y="376" text-anchor="middle" font-size="12" fill="#8a5c2a">Agent C</text>

  <!-- Wiki Files box -->
  <rect x="290" y="312" width="130" height="86" rx="14" fill="#d5ecd5" filter="url(#shadow)"/>
  <text x="355" y="348" text-anchor="middle" font-weight="600" font-size="12" fill="#3a6b3a">Wiki Files</text>
  <text x="355" y="370" text-anchor="middle" font-size="11" fill="#4d804d">(CAS / ETag)</text>
</svg>
