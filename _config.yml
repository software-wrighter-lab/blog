# Site settings
title: "Software Wrighter Lab Blog"
email: ""
description: "AI coding agents, systems programming, and practical machine learning"
author: Mike Wright
github_username: softwarewrighter

# Where the site is served from.
#
# A custom domain on a project repo serves the repo at the domain ROOT, so the
# baseurl is empty --- not "/blog", even though the repo is named blog. Getting
# this wrong breaks every stylesheet, script, and image at once while the pages
# themselves still load, because permalinks are directories and asset URLs are
# not. The bare domain is also in ./CNAME, which Jekyll copies into the build.
url: "https://blog.softwarewrighter.com"
baseurl: ""

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Permalink structure
permalink: /:year/:month/:day/:title/

# Excerpt settings
excerpt_separator: <!--more-->
show_excerpts: true

# Minima theme settings
minima:
  skin: auto
  date_format: "%B %-d, %Y"
  social_links:
    - { platform: github,  user_url: "https://github.com/softwarewrighter" }
    - { platform: youtube, user_url: "https://www.youtube.com/@SoftwareWrighter" }
    - { platform: discord, user_url: "https://discord.com/invite/Ctzk5uHggZ" }

# Header pages, in nav order
# Alphabetical by nav_title, matching the old site.
header_pages:
  - about.markdown
  - abstracts.html
  - categories.html
  - index-all.html
  - search.html
  - series.html
  - tags.html

# Default front matter
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Mike Wright"

# Exclude from processing
exclude:
  - .bundle/
  - .jekyll-cache/
  - Gemfile
  - Gemfile.lock
  - README.md
  - docs/
  - node_modules/
  - scripts/
  - vendor/
