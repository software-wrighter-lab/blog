<script>
(function() {
  function staggerOne(post) {
    if (post.dataset.staggered) return;

    const h2s = Array.from(post.querySelectorAll(':scope > h2'));
    if (h2s.length < 1) return;

    // If there are floats (TOC or resource-box) nearby, skip the first two
    // h2 sections so they flow around the floats. Otherwise stagger all.
    const container = post.closest('article, .post-item, .page-content') || post.parentElement;
    const hasFloats = container && container.querySelector('.toc, .resource-box');
    const skip = hasFloats ? 2 : 0;

    if (h2s.length < skip + 1) return;

    post.dataset.staggered = 'true';
    const toStagger = h2s.slice(skip);

    // A heading may pin its section's position with a class (kramdown:
    // {: .pos-left} / .pos-center / .pos-right on the line after it);
    // the sections after it go on alternating from there. Without any,
    // this is i % 3, as before.
    let prev = -1;
    toStagger.forEach(function(h2) {
      const pinned = h2.classList.contains('pos-left') ? 0
                   : h2.classList.contains('pos-center') ? 1
                   : h2.classList.contains('pos-right') ? 2 : null;
      const pos = pinned !== null ? pinned : (prev + 1) % 3;
      prev = pos;
      const section = document.createElement('section');
      section.className = 'stagger stagger-' + pos;

      h2.parentNode.insertBefore(section, h2);

      let node = h2;
      while (node && (node === h2 || (node.tagName !== 'H2' && node.tagName !== 'HR'))) {
        const next = node.nextElementSibling;
        section.appendChild(node);
        node = next;
      }

      // Moving a media element out of and back into the document pauses it,
      // and autoplay does not fire a second time. Resume any autoplaying
      // video that was carried into this section.
      section.querySelectorAll('video[autoplay]').forEach(function(v) {
        const p = v.play();
        if (p && p.catch) p.catch(function() {});
      });
    });
  }

  function staggerSections() {
    document.querySelectorAll('.post-content').forEach(staggerOne);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', staggerSections);
  } else {
    staggerSections();
  }
})();
</script>
